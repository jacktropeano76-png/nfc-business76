<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Connect With Us</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      display: flex; justify-content: center; align-items: center;
      font-family: Arial, Helvetica, sans-serif; color: #fff;
      background: linear-gradient(145deg, #090d16, #202938);
    }
    main {
      width: 100%; max-width: 440px; text-align: center;
      padding: 34px 24px; border: 1px solid #394456;
      border-radius: 22px; background: rgba(15, 23, 42, .92);
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 18px;
      display: grid; place-items: center; border-radius: 50%;
      background: #fff; color: #111827; font-size: 25px; font-weight: 800;
    }
    h1 { margin: 0 0 9px; font-size: 29px; }
    .intro { margin: 0 0 25px; color: #cbd5e1; font-size: 14px; letter-spacing: 2px; }
    .links { display: grid; gap: 12px; }
    .links a {
      display: block; padding: 16px 18px; border-radius: 11px;
      color: #111827; background: #fff; text-decoration: none;
      font-size: 16px; font-weight: 700; transition: transform .15s, background .15s;
    }
    .links a:hover { transform: translateY(-2px); background: #e5e7eb; }
    footer { margin-top: 25px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" id="initials">B</div>
    <h1 id="business-name">Your Business Name</h1>
    <p class="intro" id="intro">WELCOME! CONNECT WITH US</p>
    <nav class="links" id="links" aria-label="Business links"></nav>
    <footer id="footer">Thanks for connecting with us!</footer>
  </main>
  <script>
    // Edit this information for each business.
    const business = {
      name: "Your Business Name",
      initials: "B",
      intro: "WELCOME! CONNECT WITH US",
      footer: "Thanks for connecting with us!",
      links: [
        { label: "Visit Our Website", url: "https://example.com" },
        { label: "Leave a Google Review", url: "https://example.com/reviews" },
        { label: "Follow Our Instagram", url: "https://instagram.com/" },
        { label: "Find Us on Facebook", url: "https://facebook.com/" },
        { label: "Get Directions", url: "https://maps.google.com/" },
        { label: "Contact Us", url: "mailto:hello@example.com" }
      ]
    };

    document.title = business.name + " | Connect With Us";
    document.getElementById("business-name").textContent = business.name;
    document.getElementById("initials").textContent = business.initials;
    document.getElementById("intro").textContent = business.intro;
    document.getElementById("footer").textContent = business.footer;

    const linksContainer = document.getElementById("links");
    business.links.forEach(link => {
      if (!link.url || link.url.includes("example.com")) return;
      const a = document.createElement("a");
      a.href = link.url;
      a.textContent = link.label;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      linksContainer.appendChild(a);
    });
  </script>
</body>
</html>
